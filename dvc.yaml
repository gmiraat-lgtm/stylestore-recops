stages:
  ingest:
    cmd: python src/ingest.py
    deps:
    - data/raw/events.csv
    - data/raw/products.csv
    - src/ingest.py
    params:
    - ingest
    outs:
    - data/interim/events_ingested.csv
  validate:
    cmd: python src/validate.py
    deps:
    - data/interim/events_ingested.csv
    - src/validate.py
    params:
    - validate
    outs:
    - data/interim/events_valid.csv
    metrics:
    - reports/validation.json:
        cache: false
  features:
    cmd: python src/build_features.py
    deps:
    - data/interim/events_valid.csv
    - src/build_features.py
    params:
    - features
    outs:
    - data/processed/interactions.csv
  train:
    cmd: python src/train.py
    deps:
    - data/processed/interactions.csv
    - src/recommender.py
    - src/train.py
    params:
    - train
    outs:
    - models/item_cf.pkl
    - models/run_id.txt:
        cache: false
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed/interactions.csv
    - data/raw/products.csv
    - models/run_id.txt
    - src/evaluate.py
    - src/recommender.py
    params:
    - evaluate
    - train
    metrics:
    - reports/metrics.json:
        cache: false
