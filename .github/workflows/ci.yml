# RecOps - CI/CD model factory.
#
# Every push runs the complete quality chain on a clean machine:
#   1. unit tests (recommender + simulator logic)
#   2. full pipeline smoke run on a committed 2k-product sample
#      (the runner cannot reach the local DVC remote, so CI proves the
#      PIPELINE works end-to-end rather than reproducing the full dataset)
#   3. metric sanity gate - the smoke model must show real personalization
#   4. Docker image build (immutable-image pattern, model baked in)
#   5. container smoke test - the image must actually serve /health
#   6. push of the verified image to the container registry (Docker Hub),
#      from which the EC2 instance pulls what it serves - the faculty
#      architecture's CI -> registry -> cloud host chain.
#   7. continuous deployment: the runner logs into the EC2 instance over SSH,
#      replaces the serving container with this run's exact image tag, and
#      verifies over the public internet that the new version is live.
#
# A failure at any step blocks the run, so broken pipeline code or a
# degenerate model can never look "green" on main or reach the registry.

name: recops-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI dependencies
        run: pip install pandas scikit-learn scipy numpy pyyaml mlflow flask pytest requests

      - name: Unit tests
        run: python -m pytest tests -v

      - name: Pipeline smoke run on sample catalog
        run: |
          mkdir -p data/raw data/interim data/processed models reports
          cp tests/fixtures/products_sample.csv data/raw/products.csv
          python src/simulate_events.py --users 200 --events 5000 --days 14
          python src/ingest.py
          python src/validate.py
          python src/build_features.py
          python src/train.py
          python src/evaluate.py

      - name: Metric sanity gate
        run: |
          python - <<'PY'
          import json
          m = json.load(open("reports/metrics.json"))
          print(json.dumps(m, indent=2))
          assert m["users_evaluated"] > 50, "too few users evaluated"
          assert m["category_relevance_at_10"] > 0.5, \
              f"model not personalizing: relevance={m['category_relevance_at_10']}"
          print("Metric gate PASSED")
          PY

      - name: Build Docker image
        run: docker build --build-arg MODEL_VERSION=ci-${{ github.run_number }} -t recops-serving:ci-${{ github.run_number }} .

      - name: Container smoke test
        run: |
          docker run -d --rm -p 8001:8001 --name recops recops-serving:ci-${{ github.run_number }}
          sleep 8
          curl -sf http://localhost:8001/health | tee health.json
          grep -q '"status":"ok"' health.json || (echo "health check failed" && exit 1)
          docker stop recops

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag recops-serving:ci-${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/recops-serving:ci-${{ github.run_number }}
          docker tag recops-serving:ci-${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/recops-serving:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recops-serving:ci-${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recops-serving:latest

      - name: Deploy to AWS EC2 (continuous deployment)
        if: github.event_name == 'push'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/recops-serving:ci-${{ github.run_number }}
        run: |
          HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          LOGIN=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          [ -n "$HOST" ] || { echo "::error::Secret EC2_HOST is missing or empty"; exit 1; }
          [ -n "$LOGIN" ] || { echo "::error::Secret EC2_USER is missing or empty"; exit 1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "::error::Secret EC2_SSH_KEY is missing or empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Secret EC2_SSH_KEY is not a valid private key - re-paste the whole key including the BEGIN and END lines"; exit 1; }
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          $SSH "$LOGIN@$HOST" true || { echo "::error::EC2 refused the login - the public deploy key is not in ~/.ssh/authorized_keys on the instance"; exit 1; }
          $SSH "$LOGIN@$HOST" "set -e; sudo docker pull $IMAGE; sudo docker rm -f recops || true; sudo docker run -d --restart unless-stopped -p 8001:8001 --name recops $IMAGE; sudo docker image prune -af"
          echo "Container replaced with $IMAGE"

      - name: Verify live deployment on the public endpoint
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          for i in 1 2 3 4 5 6; do
            curl -sf "http://$HOST:8001/health" -o live.json && break
            sleep 5
          done
          cat live.json
          grep -q "ci-${{ github.run_number }}" live.json || { echo "::error::Live version on EC2 does not match this run"; exit 1; }
          echo "Deployed ci-${{ github.run_number }} is live on EC2"
